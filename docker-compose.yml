# Tostela: WordPress + WooCommerce en local.
# Las variables (${...}) salen de .env, que nunca se sube al repositorio.
name: tostela

x-wp-env: &wp-env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_NAME: ${DB_NAME}
  WORDPRESS_DB_USER: ${DB_USER}
  WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *wp-env
    ports:
      - "127.0.0.1:8086:80"
    volumes:
      - wp_data:/var/www/html

  # Uso: docker compose run --rm wpcli wp <orden>
  wpcli:
    image: wordpress:cli-php8.3
    profiles: ["cli"]
    user: "33:33" # el mismo www-data que la imagen de WordPress
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *wp-env
      HOME: /tmp
    volumes:
      - wp_data:/var/www/html
      - ./contenido:/proyecto/contenido:ro
      - ./assets:/proyecto/assets:ro

volumes:
  db_data:
  wp_data:
