# Tostela: WordPress + WooCommerce en local.
# Las variables (${...}) salen de .env, que nunca se sube al repositorio.
name: tostela

x-wp-env: &wp-env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_NAME: ${DB_NAME}
  WORDPRESS_DB_USER: ${DB_USER}
  WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  CORREO_REMITENTE: ${CORREO_REMITENTE:-}
  # La imagen ya marca HTTPS cuando el túnel manda X-Forwarded-Proto: https.
  # En local (127.0.0.1:8086) la tienda usa su URL local; desde fuera, el dominio.
  WORDPRESS_CONFIG_EXTRA: |
    $$tostela_local = in_array($$_SERVER['HTTP_HOST'] ?? '', ['127.0.0.1:8086', 'localhost:8086'], true);
    define('WP_HOME', $$tostela_local ? 'http://' . $$_SERVER['HTTP_HOST'] : 'https://tostela.c2developers.com');
    define('WP_SITEURL', WP_HOME);
    define('DISALLOW_FILE_EDIT', true);
    // Correo: WP Mail SMTP manda por Resend con la clave y el remitente de .env (no se guardan en la base de datos).
    if (getenv('RESEND_API_KEY')) {
      $$tostela_remitente = trim((string) getenv('CORREO_REMITENTE'));
      $$tostela_nombre = 'Tostela';
      if (preg_match('/^(.*)<([^>]+)>$/', $$tostela_remitente, $$tostela_partes)) {
        $$tostela_nombre = trim($$tostela_partes[1], " \"'") ?: $$tostela_nombre;
        $$tostela_remitente = trim($$tostela_partes[2]);
      }
      define('WPMS_ON', true);
      define('WPMS_MAILER', 'resend');
      define('WPMS_RESEND_API_KEY', getenv('RESEND_API_KEY'));
      define('WPMS_MAIL_FROM', $$tostela_remitente);
      define('WPMS_MAIL_FROM_FORCE', true);
      define('WPMS_MAIL_FROM_NAME', $$tostela_nombre);
      define('WPMS_MAIL_FROM_NAME_FORCE', true);
    }
    if (!$$tostela_local && PHP_SAPI !== 'cli' && empty($$_SERVER['HTTPS'])) {
      header('Location: https://tostela.c2developers.com' . ($$_SERVER['REQUEST_URI'] ?? '/'), true, 301);
      exit;
    }

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *wp-env
    ports:
      - "127.0.0.1:8086:80"
    volumes:
      - wp_data:/var/www/html
      - ./tema/tostela:/var/www/html/wp-content/themes/tostela:ro
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins:ro

  # Uso: docker compose run --rm wpcli wp <orden>
  wpcli:
    image: wordpress:cli-php8.3
    profiles: ["cli"]
    user: "33:33" # el mismo www-data que la imagen de WordPress
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *wp-env
      HOME: /tmp
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD}
    volumes:
      - wp_data:/var/www/html
      - ./tema/tostela:/var/www/html/wp-content/themes/tostela:ro
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins:ro
      - ./contenido:/proyecto/contenido:ro
      - ./assets:/proyecto/assets:ro
      - ./scripts:/proyecto/scripts:ro

  # Publica la tienda en https://tostela.c2developers.com (reglas en cloudflared/config.yml).
  cloudflared:
    image: cloudflare/cloudflared:2026.10.4
    restart: unless-stopped
    depends_on:
      - wordpress
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro

volumes:
  db_data:
  wp_data:
